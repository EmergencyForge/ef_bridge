<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ef_bridge</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/firetab.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        /* Both tablet containers hidden by default */
        #tabletContainer,
        #firetabContainer {
            display: none;
        }

        /* Show when .active class is added */
        #tabletContainer.active,
        #firetabContainer.active {
            display: flex;
        }
    </style>
</head>

<body>
    <!-- eNOTF tablet -->
    <div class="tablet-container" id="tabletContainer">
        <div class="tablet-frame">
            <div class="holder-left"></div>
            <div class="holder-span"></div>
            <div class="holder-right"></div>
            <div class="tablet-header">
                <div class="tablet-nav">
                    <button class="nav-btn back-btn" onclick="goBack()" title="Zurück">
                        <span class="icon">↩</span>
                    </button>
                    <button class="nav-btn home-btn" id="homeBtn" onclick="goHome()" title="Home">
                        <span class="icon">🏠</span>
                    </button>
                </div>
                <div class="tablet-title" id="pageTitle">ignis Verwaltungsportal</div>
                <button class="close-btn" onclick="closeTablet()" title="Tablet schließen (ESC)">×</button>
            </div>
            <div class="loading-screen" id="loadingScreen">
                <div class="loading-spinner"></div>
                <h3>Lade eNOTF...</h3>
                <p id="loadingText">Verbindung zum Server wird hergestellt...</p>
            </div>
            <iframe class="tablet-screen" id="tabletScreen"></iframe>
        </div>
    </div>

    <!-- FireTab tablet -->
    <div class="tablet-container" id="firetabContainer">
        <div class="tablet-frame-firetab">
            <div class="tablet-thick-left-1"></div>
            <div class="tablet-thick-left-2"></div>
            <div class="tablet-thick-right-1"></div>
            <div class="tablet-thick-right-2"></div>
            <div class="tablet-thick-right-3"></div>
            <div class="tablet-header">
                <div class="tablet-nav">
                    <button class="nav-btn home-btn" id="firetabHomeBtn" onclick="goHome()" title="Home">
                        <span class="icon">🏠</span>
                    </button>
                </div>
                <div class="tablet-title" id="firetabPageTitle">FireTab Einsatzverwaltung</div>
                <button class="close-btn" onclick="closeTablet()" title="Tablet schließen (ESC)">×</button>
            </div>
            <div class="loading-screen" id="firetabLoadingScreen">
                <div class="loading-spinner"></div>
                <h3>Lade FireTab...</h3>
                <p id="firetabLoadingText">Verbindung zum Server wird hergestellt...</p>
            </div>
            <iframe class="tablet-screen" id="firetabScreen"></iframe>
        </div>
    </div>

    <!-- Admin panel (/efbridge), filled by js/admin.js -->
    <div class="efb-admin" id="adminPanel" hidden>
        <div class="efb-panel" role="dialog" aria-modal="true" aria-labelledby="efbTitle">
            <header class="efb-header">
                <div class="efb-brand"><img src="img/ef-mark.png" alt=""></div>
                <div class="efb-header__text">
                    <h1 class="efb-header__title" id="efbTitle">ef_bridge</h1>
                    <div class="efb-header__meta"><span>Einstellungen</span><span id="efbVersion" hidden></span></div>
                </div>
                <div class="efb-header__chips" id="efbChips"></div>
                <span class="efb-header__spacer"></span>
                <button type="button" class="efb-btn efb-btn--ghost" id="efbRefresh">Neu laden</button>
                <button type="button" class="efb-btn efb-btn--ghost efb-btn--icon" id="efbClose" aria-label="Schließen (ESC)">×</button>
            </header>
            <div class="efb-body">
                <nav class="efb-nav" id="efbNav" aria-label="Bereiche"></nav>
                <main class="efb-content" id="efbContent"></main>
            </div>
            <footer class="efb-footer">
                <span class="efb-footer__pending" id="efbPending"></span>
                <button type="button" class="efb-btn efb-btn--ghost" id="efbDiscard" disabled>Verwerfen</button>
                <button type="button" class="efb-btn efb-btn--primary" id="efbSave" disabled>Speichern</button>
            </footer>
        </div>
        <div class="efb-toast" id="efbToast" role="status" hidden></div>
    </div>

    <script src="js/firetab.js"></script>
    <script src="js/script.js"></script>
    <script src="js/master.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
