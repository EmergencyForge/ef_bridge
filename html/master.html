<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ef_bridge</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/firetab.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        /* Both tablet containers hidden by default */
        #tabletContainer,
        #firetabContainer {
            display: none;
        }

        /* Show when .active class is added */
        #tabletContainer.active,
        #firetabContainer.active {
            display: flex;
        }
    </style>
</head>

<body>
    <!-- eNOTF tablet -->
    <div class="tablet-container" id="tabletContainer">
        <div class="tablet-frame">
            <div class="holder-left"></div>
            <div class="holder-span"></div>
            <div class="holder-right"></div>
            <div class="tablet-header">
                <div class="tablet-nav">
                    <button class="nav-btn back-btn" onclick="goBack()" title="Zurück">
                        <span class="icon">↩</span>
                    </button>
                    <button class="nav-btn home-btn" id="homeBtn" onclick="goHome()" title="Home">
                        <span class="icon">🏠</span>
                    </button>
                </div>
                <div class="tablet-title" id="pageTitle">ignis Verwaltungsportal</div>
                <button class="close-btn" onclick="closeTablet()" title="Tablet schließen (ESC)">×</button>
            </div>
            <div class="loading-screen" id="loadingScreen">
                <div class="loading-spinner"></div>
                <h3>Lade eNOTF...</h3>
                <p id="loadingText">Verbindung zum Server wird hergestellt...</p>
            </div>
            <iframe class="tablet-screen" id="tabletScreen"></iframe>
        </div>
    </div>

    <!-- FireTab tablet -->
    <div class="tablet-container" id="firetabContainer">
        <div class="tablet-frame-firetab">
            <div class="tablet-thick-left-1"></div>
            <div class="tablet-thick-left-2"></div>
            <div class="tablet-thick-right-1"></div>
            <div class="tablet-thick-right-2"></div>
            <div class="tablet-thick-right-3"></div>
            <div class="tablet-header">
                <div class="tablet-nav">
                    <button class="nav-btn home-btn" id="firetabHomeBtn" onclick="goHome()" title="Home">
                        <span class="icon">🏠</span>
                    </button>
                </div>
                <div class="tablet-title" id="firetabPageTitle">FireTab Einsatzverwaltung</div>
                <button class="close-btn" onclick="closeTablet()" title="Tablet schließen (ESC)">×</button>
            </div>
            <div class="loading-screen" id="firetabLoadingScreen">
                <div class="loading-spinner"></div>
                <h3>Lade FireTab...</h3>
                <p id="firetabLoadingText">Verbindung zum Server wird hergestellt...</p>
            </div>
            <iframe class="tablet-screen" id="firetabScreen"></iframe>
        </div>
    </div>

    <!-- Admin panel (/efbridge), filled by js/admin.js. Built like the ignis
         shell: topbar, collapsible sidebar, content with a sticky save bar. -->
    <div class="efb-admin" id="adminPanel" hidden>
        <div class="efb-app" role="dialog" aria-modal="true" aria-labelledby="efbTitle">
            <header class="efb-topbar">
                <button type="button" class="efb-topbar__toggle" id="efbToggle" aria-expanded="true" aria-controls="efbSidebar" aria-label="Navigation ein- oder ausklappen" data-tooltip="Navigation ein- oder ausklappen ([)">
                    <span class="efb-burger" aria-hidden="true"><span></span><span></span><span></span></span>
                </button>
                <span class="efb-topbar__mark" aria-hidden="true"><img src="img/ef-mark.png" alt=""></span>
                <span class="efb-topbar__title" id="efbTitle">ef_bridge</span>
                <span class="efb-topbar__meta">Einstellungen</span>
                <div class="efb-topbar__chips" id="efbChips"></div>
                <span class="efb-topbar__spacer"></span>
                <button type="button" class="efb-btn efb-btn--ghost efb-btn--sm" id="efbRefresh">Neu laden</button>
                <button type="button" class="efb-btn efb-btn--ghost efb-btn--icon efb-btn--sm" id="efbClose" aria-label="Schließen (ESC)">×</button>
            </header>
            <div class="efb-sidebar" id="efbSidebar">
                <nav class="efb-sidebar__nav" id="efbNav" aria-label="Bereiche"></nav>
                <div class="efb-sidebar__version" id="efbVersion" hidden></div>
            </div>
            <main class="efb-main">
                <div class="efb-page" id="efbContent"></div>
                <footer class="efb-actionbar">
                    <span class="efb-actionbar__status" id="efbPending"></span>
                    <button type="button" class="efb-btn efb-btn--ghost" id="efbDiscard" disabled>Verwerfen</button>
                    <button type="button" class="efb-btn efb-btn--primary" id="efbSave" disabled>Speichern</button>
                </footer>
            </main>
        </div>
        <div class="efb-toast" id="efbToast" role="status" hidden></div>
        <!-- in-panel question; CEF shows window.confirm as a bare Windows dialog -->
        <div class="efb-confirm" id="efbConfirm" hidden>
            <div class="efb-confirm__dialog" role="alertdialog" aria-modal="true" aria-labelledby="efbConfirmTitle" aria-describedby="efbConfirmText">
                <h2 class="efb-confirm__title" id="efbConfirmTitle"></h2>
                <p class="efb-confirm__text" id="efbConfirmText"></p>
                <div class="efb-confirm__actions">
                    <button type="button" class="efb-btn efb-btn--ghost" id="efbConfirmCancel">Zurück</button>
                    <button type="button" class="efb-btn efb-btn--danger" id="efbConfirmOk"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/firetab.js"></script>
    <script src="js/script.js"></script>
    <script src="js/master.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/dui.js"></script>
</body>

</html>
